server:
  port: 8080

spring:
  application:
    name: wallet-api
  data:
    mongodb:
      uri: mongodb://localhost:27017/wallet
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# LoggingX Configuration
loggingx:
  service: wallet-api              # Nome do serviço
  env: ${ENVIRONMENT:dev}          # Ambiente (dev, qa, prod)
  version: ${APP_VERSION:0.0.1-SNAPSHOT}  # Versão da aplicação
  
  # Chaves a serem mascaradas nos logs
  redact-keys: 
    - password
    - token 
    - cpf
    - email
    - secret
    - accountNumber
    - balance
    - amount
    
  # Configurações HTTP
  http:
    server:
      enabled: true
      log-body: true
    client: 
      enabled: true
      log-body: true
      
  # Configurações MongoDB 
  mongo:
    enabled: true
    slow-queries-only: true
    slow-threshold-ms: 1000
    
  # Sampling para controle de volume de logs
  sampling:
    default-percent: 100  # 100% em desenvolvimento
    rules:
      - pattern: ".*HealthCheck.*" 
        percent: 10       # 10% para health checks
